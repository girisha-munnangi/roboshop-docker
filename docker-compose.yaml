services:
  catalogue:
    build: ./catalogue
    image: girishamunnangi/catalogue:1.0.0
    container_name:  catalogue
    depends_on: 
    - mongodb

  user:
    build: ./user
    image: girishamunnangi/user:1.0.0
    container_name: user
    depends_on:
    - redis
    - mongodb
  
  cart:
    build: ./cart
    image: girishamunnangi/cart:1.0.0
    container_name: cart
    depends_on :
    - redis
    - catalogue

  shipping:
    build: ./shipping
    image: girishamunnangi/shipping:1.0.0
    container_name: shipping
    depends_on:
    - mysql
    - cart

  payment:
    build: ./payment
    image: girishamunnangi/payment:1.0.0
    container_name: payment
    environment:
      CART_HOST: "cart"
      CART_PORT: "8080"
      USER_HOST: "user"
      USER_PORT: "8080"
      AMQP_HOST: "rabbitmq"
      AMQP_USER: "roboshop"
      AMQP_PASS: "roboshop123"
    depends_on:
    - cart
    - user
    - rabbitmq

  frontend:
    build: ./frontend
    image: girishamunnangi/frontend:1.0.0
    container_name: frontend
    ports:
    - "80:80"
    depends_on:
    - catalogue
    - user
    - cart
    - payment
    - shipping

  mongodb:
    build: ./mongodb
    image: girishamunnangi/mongodb:1.0.0
    container_name: mongodb
  
  redis:
    image: redis:7.0
    container_name: redis

  mysql:
    build: ./mysql
    image: girishamunnangi/mysql:1.0.0
    container_name: mysql

  rabbitmq:
    image: girishamunnangi/rabbitmq:1.0.0
    container_name: rabbitmq
    environment: 
      RABBITMQ_DEFAULT_USER: roboshop
      RABBITMQ_DEFAULT_PASS: roboshop123
  networks:
    default:
      driver: bridge
      name: roboshop
      external: false
